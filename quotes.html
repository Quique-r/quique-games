<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotes · qu1_qu3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #2a2a3a;
    --accent: #00ffc8;
    --accent2: #ff4fa3;
    --accent3: #ffe066;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --card: #18181f;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; padding: 0 1rem 4rem; }

  header { text-align: center; padding: 3rem 1rem 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
  .tag { display: inline-block; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: var(--accent); border: 1px solid var(--accent); padding: 4px 12px; border-radius: 2px; margin-bottom: 1rem; text-transform: uppercase; }
  h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
  h1 span { color: var(--accent2); }
  .subtitle { color: var(--muted); font-size: 15px; margin-top: 0.75rem; }

  .nav-links { display: flex; gap: 10px; justify-content: center; margin-top: 1.25rem; flex-wrap: wrap; }
  .nav-link { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); text-decoration: none; border: 1px solid var(--border); padding: 6px 14px; border-radius: 2px; transition: border-color 0.15s, color 0.15s; }
  .nav-link:hover { border-color: var(--accent); color: var(--accent); }

  .search-wrap { max-width: 560px; margin: 0 auto 1.25rem; position: relative; }
  .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  input[type="text"] { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 15px; padding: 12px 16px 12px 44px; outline: none; transition: border-color 0.15s; }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .btn, select { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.05em; padding: 7px 14px; border-radius: 2px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; text-transform: uppercase; transition: all 0.15s; }
  .btn:hover, select:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,255,200,0.07); }
  .btn.random { border-color: var(--accent2); color: var(--accent2); }
  .btn.random:hover { background: rgba(255,79,163,0.08); }
  select { text-transform: none; max-width: 220px; }

  .stats { text-align: center; font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); margin-bottom: 1.5rem; letter-spacing: 0.05em; }
  .stats span { color: var(--accent); font-weight: 700; }

  .list { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  .quote-card { background: var(--card); border: 1px solid var(--border); border-left: 2px solid var(--accent2); border-radius: 4px; padding: 16px 18px; transition: border-color 0.15s; }
  .quote-card:hover { border-color: var(--accent2); }
  .quote-card.highlight { border-color: var(--accent); border-left-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .quote-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .quote-id { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: var(--accent2); }
  .quote-votes { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .quote-votes .up { color: var(--accent); }
  .quote-votes .down { color: var(--accent2); margin-left: 8px; }

  .quote-text { font-size: 17px; line-height: 1.5; color: var(--text); word-break: break-word; }

  .quote-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .chip { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.05em; padding: 3px 9px; border-radius: 2px; border: 1px solid var(--border); color: var(--muted); }
  .chip.game { color: var(--accent3); border-color: var(--accent3); background: rgba(255,224,102,0.06); }
  .chip.user { color: var(--accent); border-color: var(--accent); background: rgba(0,255,200,0.05); }
  .quote-context { font-size: 13px; color: var(--muted); font-style: italic; }

  .empty { text-align: center; color: var(--muted); padding: 4rem 1rem; font-family: 'Space Mono', monospace; font-size: 13px; }
  .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 0.5rem; font-family: 'Space Grotesk', sans-serif; }

  footer { text-align: center; margin-top: 4rem; font-size: 12px; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: 0.05em; }
  footer a { color: var(--accent2); text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="tag">qu1_qu3 · Twitch</div>
  <h1>Quo<span>tes</span></h1>
  <p class="subtitle">Lo mejor (y lo peor) que se ha dicho en el stream</p>
  <div class="nav-links">
    <a class="nav-link" href="/quique-games/">🎮 Juegos</a>
    <a class="nav-link" href="/quique-games/commands.html">⌨️ Comandos</a>
    <a class="nav-link" href="/quique-games/info.html">💎 Info</a>
  </div>
</header>

<div class="search-wrap">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  <input type="text" id="search" placeholder="Buscar por texto, autor, contexto o # ..." autocomplete="off" spellcheck="false">
</div>

<div class="controls">
  <button class="btn active" data-sort="new">Recientes</button>
  <button class="btn" data-sort="old">Antiguas</button>
  <button class="btn" data-sort="top">Mejor votadas</button>
  <select id="gameFilter" aria-label="Filtrar por juego"><option value="">Todos los juegos</option></select>
  <button class="btn random" id="randomBtn">🎲 Al azar</button>
</div>

<p class="stats" id="stats">Cargando...</p>
<div class="list" id="list"></div>

<footer>
  <p>Actualizado automáticamente · <a href="https://twitch.tv/qu1_qu3" target="_blank" rel="noopener">twitch.tv/qu1_qu3</a></p>
</footer>

<script>
const JSON_URL = 'https://quique-r.github.io/quique-games/quotes.json';
let allQuotes = [];
let currentSort = 'new';
let highlightId = null;

// Las quotes las escribe el chat, así que todo se pinta con textContent (nunca innerHTML)
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function load() {
  try {
    const res = await fetch(JSON_URL + '?t=' + Date.now());
    const data = await res.json();
    allQuotes = data.quotes || [];
    buildGameFilter();
    render();
  } catch (e) {
    document.getElementById('stats').textContent = 'Error cargando quotes';
  }
}

function buildGameFilter() {
  const sel = document.getElementById('gameFilter');
  const games = [...new Set(allQuotes.map(q => q.game).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
  games.forEach(g => {
    const o = document.createElement('option');
    o.value = g;
    o.textContent = g;
    sel.appendChild(o);
  });
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const game = document.getElementById('gameFilter').value;

  let list = allQuotes.filter(item => {
    if (game && item.game !== game) return false;
    if (!q) return true;
    const num = q.replace('#', '');
    return String(item.id) === num ||
           (item.quote || '').toLowerCase().includes(q) ||
           (item.user || '').toLowerCase().includes(q) ||
           (item.context || '').toLowerCase().includes(q) ||
           (item.game || '').toLowerCase().includes(q);
  });

  if (currentSort === 'new') list.sort((a, b) => b.id - a.id);
  else if (currentSort === 'old') list.sort((a, b) => a.id - b.id);
  else list.sort((a, b) => ((b.up - b.down) - (a.up - a.down)) || (b.id - a.id));

  return list;
}

function buildCard(item) {
  const card = el('div', 'quote-card' + (item.id === highlightId ? ' highlight' : ''));

  const top = el('div', 'quote-top');
  top.appendChild(el('span', 'quote-id', '#' + item.id));
  const votes = el('span', 'quote-votes');
  votes.appendChild(el('span', 'up', '👍 ' + (item.up || 0)));
  votes.appendChild(el('span', 'down', '👎 ' + (item.down || 0)));
  top.appendChild(votes);
  card.appendChild(top);

  card.appendChild(el('div', 'quote-text', item.quote));

  const meta = el('div', 'quote-meta');
  if (item.user) meta.appendChild(el('span', 'chip user', '— ' + item.user));
  if (item.game) meta.appendChild(el('span', 'chip game', '🎮 ' + item.game));
  if (item.context) meta.appendChild(el('span', 'quote-context', '(' + item.context + ')'));
  if (meta.children.length) card.appendChild(meta);

  return card;
}

function render() {
  const list = getFiltered();
  const box = document.getElementById('list');
  const stats = document.getElementById('stats');
  box.replaceChildren();

  stats.replaceChildren();
  stats.appendChild(el('span', '', String(list.length)));
  stats.appendChild(document.createTextNode(' quotes encontradas'));

  if (list.length === 0) {
    const empty = el('div', 'empty');
    empty.appendChild(el('strong', '', 'Sin resultados'));
    empty.appendChild(document.createTextNode('Intenta con otro término'));
    box.appendChild(empty);
    return;
  }

  list.forEach(item => box.appendChild(buildCard(item)));
}

document.getElementById('search').addEventListener('input', () => { highlightId = null; render(); });
document.getElementById('gameFilter').addEventListener('change', () => { highlightId = null; render(); });

document.querySelectorAll('.btn[data-sort]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-sort]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    highlightId = null;
    render();
  });
});

document.getElementById('randomBtn').addEventListener('click', () => {
  if (allQuotes.length === 0) return;
  const pick = allQuotes[Math.floor(Math.random() * allQuotes.length)];
  document.getElementById('search').value = '';
  document.getElementById('gameFilter').value = '';
  highlightId = pick.id;
  const box = document.getElementById('list');
  const stats = document.getElementById('stats');
  box.replaceChildren(buildCard(pick));
  stats.replaceChildren();
  stats.appendChild(document.createTextNode('Quote al azar · toca un filtro para volver a la lista'));
});

load();
</script>
</body>
</html>
